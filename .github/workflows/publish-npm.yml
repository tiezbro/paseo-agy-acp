name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, pack & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/paseo-agy-acp
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.16.0

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be three-part semver: vX.Y.Z" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "workflow checkout is not the requested release tag" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate release source
        run: npm run validate

      - name: Build npm tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack --json > npm-pack.json
          package_file="$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('npm-pack.json','utf8')); if (data.length !== 1 || !data[0].filename) process.exit(1); process.stdout.write(data[0].filename)")"
          test -f "$package_file"
          tar -tzf "$package_file" > npm-pack-contents.txt
          if grep -Eiq '\.(par|db|sqlite|sqlite3)$' npm-pack-contents.txt; then
            echo "npm tarball contains a forbidden runtime artifact" >&2
            exit 1
          fi
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Upload npm tarball evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package-${{ github.ref_name }}
          path: |
            ${{ steps.pack.outputs.package_file }}
            npm-pack.json
            npm-pack-contents.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.package_file }}" --access public --provenance
